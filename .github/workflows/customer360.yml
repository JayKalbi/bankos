name: Customer 360 Service CI
on:
  push:
    paths:
      - 'services/customer360/**'
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customer_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build & Test
        run: |
          cd services/customer360
          mvn clean test
      - name: Docker Build
        run: docker build -t ghcr.io/jaykalbi/bankos-customer360:latest services/customer360
