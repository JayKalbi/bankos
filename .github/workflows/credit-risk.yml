name: Credit Risk Service CI
on:
  push:
    paths:
      - 'services/credit-risk/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Build & Test
        run: |
          cd services/credit-risk
          pip install -r requirements.txt
          pytest tests/
      - name: Docker Build
        run: docker build -t ghcr.io/jaykalbi/bankos-credit-risk:latest services/credit-risk