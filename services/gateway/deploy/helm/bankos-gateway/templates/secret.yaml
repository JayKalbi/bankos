{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bankos-gateway.fullname" . }}-secret
  labels:
    {{- include "bankos-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_PUBLIC_KEY_BASE64: {{ .Values.secret.JWT_PUBLIC_KEY_BASE64 | quote }}
{{- end }}
