openapi: 3.0.3
info:
  title: BankOS API Gateway
  version: 1.0.0
  description: Enterprise API Gateway handling ingress, JWT validation, and routing.
paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: OK
  /api/v1/auth/login:
    post:
      summary: Proxy to Identity Service
      responses:
        '200':
          description: OK
  /api/v1/customers/{id}:
    get:
      summary: Proxy to Customer360 Service
      responses:
        '200':
          description: OK
  /api/v1/risk/evaluate:
    post:
      summary: Proxy to Credit Risk Service
      responses:
        '200':
          description: OK
