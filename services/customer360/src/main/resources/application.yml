server:
  port: 8080
spring:
  application:
    name: customer360-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/customer_db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true